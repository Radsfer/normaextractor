name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências de teste
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar e buildar
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Iniciar build no servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'bash /home/rafael/normaextractor/scripts/deploy.sh'
      - name: Aguardar build e subir container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for i in $(seq 1 60); do
            out=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'tail -20 /home/rafael/normaextractor/build.log 2>/dev/null' 2>/dev/null) || out=""
            if echo "$out" | grep -qE 'failed to solve|^ERROR|CANCELED'; then
              echo "$out"
              echo "Build falhou no servidor"
              exit 1
            fi
            if echo "$out" | grep -q 'Image normaextractor-app Built'; then
              echo "Build concluído. Subindo container..."
              ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'cd /home/rafael/normaextractor && docker compose up -d'
              exit 0
            fi
            echo "Aguardando build no servidor... ($i)"
            sleep 30
          done
          echo "Timeout aguardando o build no servidor"
          exit 1

