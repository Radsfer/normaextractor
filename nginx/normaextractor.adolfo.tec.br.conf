server {
    listen 80;
    server_name normaextractor.adolfo.tec.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name normaextractor.adolfo.tec.br;

    ssl_certificate /etc/letsencrypt/live/normaextractor.adolfo.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/normaextractor.adolfo.tec.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # uploads de até 20 MB (REQ-FUNC-001) com folga para o multipart
    client_max_body_size 25M;

    access_log /var/log/nginx/normaextractor.access.log main;
    error_log /var/log/nginx/normaextractor.error.log notice;

    # SSE do chat (REQ-FUNC-012): sem buffering/cache, timeouts longos
    location /api/v1/chat {
        proxy_pass http://normaextractor-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://normaextractor-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
